# ==================================================================================================
# newsyslog-tokeniko.conf — log rotation for the three LaunchAgents (runbook §1.2)
#
# A mind that runs for months writes for months. Without this, logs/ grows until the disk that
# holds his biography is the thing that stops him.
#
# INSTALLED BY THE CAPTAIN'S HAND (it needs root, so no script here does it):
#     sudo cp scripts/body/newsyslog-tokeniko.conf /etc/newsyslog.d/tokeniko.conf
#     sudo chown root:wheel /etc/newsyslog.d/tokeniko.conf
#     sudo chmod 644 /etc/newsyslog.d/tokeniko.conf
#     sudo newsyslog -nv          # DRY RUN — prints what it would do to each file, changes nothing
#
# SIX files, not four: three services x (stdout + stderr). launchd writes both streams to disk.
#
# Columns (see newsyslog.conf(5)):
#   logfilename  owner:group  mode  count  size(KB)  when  flags
#     count = 7      keep seven generations (~a week of busy days, months of quiet ones)
#     size  = 20480  rotate at 20 MB, whenever it is reached
#     when  = *      no calendar schedule; size is the only trigger
#     flags = NJ     N = no process to signal (launchd reopens on its own after a rotation);
#                    J = compress the rotated generation with bzip2
#
# owner:group is REQUIRED here: newsyslog runs as root, and without it the recreated log files
# would be owned by root and the user-session LaunchAgents could no longer write to them.
#
# THE PATHS ARE ABSOLUTE and hardcode the username. Same caveat as the plists: same user, same
# repo path, or regenerate.
# ==================================================================================================

# logfilename                                                              [owner:group]     mode count size   when  flags
/Users/renzosala/Develop/personal/tokeniko/tokeniko/logs/api.out.log       renzosala:staff   644  7     20480  *     NJ
