[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokeniko-tk2"
version = "0.1.0"
description = "tokeniko 2 — the body: an interpreter of the db"
requires-python = ">=3.12"

# The list is CLOSED, like the register (stack req. 6): adding a dependency takes an argument, and
# the argument is settled by the Captain and the QM before it lands here. numpy-scale everywhere —
# no heavyweight ML framework (stack req. 1); one persistence stack (stack req. 3).
# pydantic and pymongo arrive under bunnet anyway; they are named because the body depends on them
# DIRECTLY (models are the single source of shape; timeseries deletes go through raw pymongo).
dependencies = [
    "pydantic",
    "bunnet",
    "pymongo",
    "numpy",
    "taskipy",
    # admitted 2026-08-23 by the Captain (T1 finding 1): the datatier reads .env the tk2_config way
    "python-dotenv",
]

[tool.taskipy.tasks]
# The body. One process for now; the mind / surface / connectors split (body req. 6) arrives with
# its own tasks when there is something to separate.
body = "python -m tk2.body"

[tool.setuptools.packages.find]
where = ["."]
include = ["tk2*"]
# `db/` (migrations) and `tools/` (runnable utilities) are deliberately NOT packages: they are run,
# not imported. A migration that could be imported would be a migration someone imports.
